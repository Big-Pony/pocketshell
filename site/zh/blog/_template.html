<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>{{TITLE}} — PocketShell</title>
<meta name="description" content="{{DESCRIPTION}}" />
<link rel="canonical" href="https://pocketshell.net/zh/blog/{{SLUG}}" />
<link rel="alternate" hreflang="en" href="https://pocketshell.net/blog/{{SLUG}}" />
<link rel="alternate" hreflang="zh-Hans" href="https://pocketshell.net/zh/blog/{{SLUG}}" />
<link rel="alternate" hreflang="x-default" href="https://pocketshell.net/blog/{{SLUG}}" />

<meta property="og:type" content="article" />
<meta property="og:site_name" content="PocketShell" />
<meta property="og:locale" content="zh_CN" />
<meta property="og:locale:alternate" content="en_US" />
<meta property="og:url" content="https://pocketshell.net/zh/blog/{{SLUG}}" />
<meta property="og:title" content="{{TITLE}}" />
<meta property="og:description" content="{{DESCRIPTION}}" />
<meta property="og:image" content="https://pocketshell.net/assets/og-cover.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{TITLE}}" />
<meta name="twitter:description" content="{{DESCRIPTION}}" />
<meta name="twitter:image" content="https://pocketshell.net/assets/og-cover.png" />

<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/site.css?v=20260807" />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": "{{TITLE}}",
  "description": "{{DESCRIPTION}}",
  "inLanguage": "zh-CN",
  "datePublished": "{{DATE}}",
  "dateModified": "{{DATE}}",
  "mainEntityOfPage": { "@type": "WebPage", "@id": "https://pocketshell.net/zh/blog/{{SLUG}}" },
  "author": { "@type": "Person", "name": "Big-Pony", "url": "https://github.com/Big-Pony" },
  "publisher": { "@type": "Organization", "name": "PocketShell", "url": "https://pocketshell.net/" }
}
</script>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="/zh"><span class="logo">❯_</span>PocketShell</a>
    <nav class="nav-links">
      <a href="https://demo.pocketshell.net">在线演示</a>
      <a href="/zh/blog">文章</a>
      <a href="/zh#features">功能</a>
      <a href="/zh#quickstart">快速开始</a>
      <a href="/zh#security">安全</a>
    </nav>
    <a class="btn-lang" href="/blog/{{SLUG}}" hreflang="en" title="English">English</a>
    <a class="btn-gh" href="https://github.com/Big-Pony/pocketshell" target="_blank" rel="noopener">GitHub ★</a>
  </div>
</header>

<article class="article">
  <p class="article-meta">{{DATE}}</p>
  <h1>{{TITLE}}</h1>
  <p class="lede">{{LEDE}}</p>

  {{BODY}}

  <div class="article-nav">
    <a href="/zh/blog">← 所有文章</a>
  </div>
</article>

<footer>
  <div class="wrap foot">
    <span class="brand" style="font-size:14.5px"><span class="logo" style="width:24px;height:24px;font-size:12px">❯_</span>PocketShell</span>
    <a href="https://github.com/Big-Pony/pocketshell" target="_blank" rel="noopener">GitHub</a>
    <a href="/zh/blog">文章</a>
    <a href="/blog/{{SLUG}}" hreflang="en">English</a>
    <span class="sp">© 2026 PocketShell · Apache-2.0</span>
  </div>
</footer>

</body>
</html>
