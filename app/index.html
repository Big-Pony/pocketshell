<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PocketShell</title>
    <!-- PWA: installable on mobile Chrome (manifest + /sw.js registered in main.ts) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Default theme (cream-dark) --bg-deep; the inline script below rewrites it. -->
    <meta name="theme-color" content="#242524" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <!-- Terminal font is render-blocking; start the fetch before the CSS asks for it (Bold stays lazy). -->
    <link rel="preload" href="/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- iOS does not read the manifest; these keep "Add to Home Screen" decent there too -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PocketShell" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Apply the persisted theme + language before first paint (FOUC guard).
      // 这段脚本跑在任何 CSS 之前，所以它没法自己算出「当前主题是什么颜色」。
      //
      // 2026-08-05 之前的解法是在这里手抄一份「主题 → --bg-deep」表（index.html
      // 与 demo.html 各一份），加一套主题漏抄一处就静默闪错色。现在改为**用完即存**：
      // lib/theme.ts 的 applyTheme() 每次换主题都把当前的 --bg-deep 与明暗写回
      // ps.settings，这里只读不算——主题有多少套、各自什么颜色，本文件一概不需要
      // 知道。于是主题列表、浅色集合、每套色值三份手抄一起消失。
      (function () {
        // 首帧兜底：默认主题 cream-dark 的 --bg-deep（见 src/theme-tokens.css）。
        // **全套体系里唯一保留的硬编码色值**，只有首次访问会用到它。
        var FALLBACK_BG = "#242524";
        var pref = "", scheme = "", bootBg = "", lang = "";
        try {
          var s = JSON.parse(localStorage.getItem("ps.settings") || "{}");
          if (typeof s.theme === "string") pref = s.theme;
          if (s.scheme === "light" || s.scheme === "dark") scheme = s.scheme;
          if (typeof s.bootBg === "string") bootBg = s.bootBg;
          if (s.language === "zh" || s.language === "en") lang = s.language;
        } catch (e) {}
        var root = document.documentElement;
        var bg = bootBg || FALLBACK_BG;
        // "system" 是指针不是配色，解析它要读 OS 偏好并挑一套具体主题——那又得
        // 在这里写死主题名。交给 main.ts 的 applyTheme()，这里只管背景色：首帧
        // 唯一可见的东西就是它（#app 此时还是空的），而它走上面的缓存值。
        if (pref && pref !== "system") root.dataset.theme = pref;
        root.dataset.scheme = scheme || "dark";
        // 内联样式，因为 app.css 还没到。applyTheme() 接手后会撤掉它，之后背景由
        // app.css 的 html{background:var(--bg-deep)} 负责，换主题才跟得上。
        root.style.background = bg;
        // Android Chrome tints the address bar from this; the manifest's
        // theme_color is only a static install-time snapshot.
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", bg);
        if (!lang) lang = (navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
        root.lang = lang === "zh" ? "zh-CN" : "en";
      })();
    </script>
    <!-- 用户自己的 .ghostty 主题（agent 的 <keyDir>/themes/）。
         同步阻塞加载**是要的**：这样自定义主题的令牌在首帧之前就位，不需要任何
         缓存逻辑（设计 4.3）。放在 main.ts 之前、app.css 之后——app.css 由
         main.ts import，vite 会把它插进 <head>，顺序上仍在本行之后生效，
         而自定义令牌本就该盖过内置的。
         加载失败不阻塞渲染：demo 站没有 agent，这里就是 404，浏览器跳过即可；
         内置 7 套照常工作。 -->
    <link rel="stylesheet" href="/theme/custom.css" data-ps-theme="custom" />
  </head>
  <body style="margin:0">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
